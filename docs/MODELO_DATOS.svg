<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" fill="#f7f7f1"/><g font-family="Arial,sans-serif"><text x="50" y="52" fill="#174d3d" font-size="28" font-weight="700">La Embajada Paisa · Modelo de datos</text><text x="50" y="82" fill="#718078" font-size="14">Entidades implementadas en el Sprint 1 · Las reservas se incorporarán en otro incremento.</text><rect x="50" y="125" width="320" height="286" rx="12" fill="white" stroke="#d5ddcc"/><path d="M62 125h296q12 0 12 12v36H50V137q0-12 12-12Z" fill="#174d3d"/><text x="70" y="156" fill="white" font-size="18" font-weight="700">users (cuentas)</text><text x="70" y="202" fill="#405d45" font-size="13">id · PK</text><text x="70" y="230" fill="#405d45" font-size="13">name</text><text x="70" y="258" fill="#405d45" font-size="13">email · UNIQUE</text><text x="70" y="286" fill="#405d45" font-size="13">password · hash</text><text x="70" y="314" fill="#405d45" font-size="13">rol · administrador / trabajador / cliente</text><text x="70" y="342" fill="#405d45" font-size="13">activo · boolean</text><text x="70" y="370" fill="#405d45" font-size="13">remember_token · opcional</text><text x="70" y="398" fill="#405d45" font-size="13">created_at / updated_at</text><rect x="465" y="125" width="320" height="286" rx="12" fill="white" stroke="#d5ddcc"/><path d="M477 125h296q12 0 12 12v36H465V137q0-12 12-12Z" fill="#174d3d"/><text x="485" y="156" fill="white" font-size="18" font-weight="700">clientes (fichas)</text><text x="485" y="202" fill="#405d45" font-size="13">id · PK</text><text x="485" y="230" fill="#405d45" font-size="13">tipo_documento</text><text x="485" y="258" fill="#405d45" font-size="13">numero_documento · UNIQUE</text><text x="485" y="286" fill="#405d45" font-size="13">nombre / apellido</text><text x="485" y="314" fill="#405d45" font-size="13">email · UNIQUE, opcional</text><text x="485" y="342" fill="#405d45" font-size="13">telefono</text><text x="485" y="370" fill="#405d45" font-size="13">user_id · FK, UNIQUE, opcional</text><text x="485" y="398" fill="#405d45" font-size="13">created_at / updated_at</text><rect x="850" y="125" width="320" height="258" rx="12" fill="white" stroke="#d5ddcc"/><path d="M862 125h296q12 0 12 12v36H850V137q0-12 12-12Z" fill="#174d3d"/><text x="870" y="156" fill="white" font-size="18" font-weight="700">mesas (inventario)</text><text x="870" y="202" fill="#405d45" font-size="13">id · PK</text><text x="870" y="230" fill="#405d45" font-size="13">numero · UNIQUE</text><text x="870" y="258" fill="#405d45" font-size="13">capacidad</text><text x="870" y="286" fill="#405d45" font-size="13">ubicacion</text><text x="870" y="314" fill="#405d45" font-size="13">descripcion · opcional</text><text x="870" y="342" fill="#405d45" font-size="13">habilitada · boolean</text><text x="870" y="370" fill="#405d45" font-size="13">created_at / updated_at</text><path d="M370 285h95" stroke="#8b9d7c" stroke-width="2"/><circle cx="378" cy="285" r="4" fill="#f7f7f1" stroke="#8b9d7c"/><circle cx="457" cy="285" r="4" fill="#f7f7f1" stroke="#8b9d7c"/><text x="382" y="268" fill="#718078" font-size="12">0..1 ↔ 0..1</text><rect x="50" y="470" width="1120" height="170" rx="12" fill="#eaf0e2"/><text x="75" y="506" fill="#174d3d" font-size="17" font-weight="700">Relación entre cuenta y ficha</text><text x="75" y="537" fill="#536b4d" font-size="14">Una ficha puede existir sin cuenta. Al vincularla, una restricción única impide que dos fichas usen la misma cuenta.</text><text x="75" y="565" fill="#536b4d" font-size="14">El administrador asigna la ficha a una cuenta con rol Cliente. El perfil se consulta a partir del usuario autenticado.</text><text x="75" y="602" fill="#536b4d" font-size="13">Mesas es una entidad independiente en este incremento. Habilitación física no equivale a disponibilidad por fecha y hora.</text></g></svg>